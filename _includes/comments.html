{%- comment -%}
  giscus comments (GitHub Discussions). Enable and configure in _config.yml.
  The script is injected with the reader's current light/dark theme.
{%- endcomment -%}
{%- if site.giscus.enabled and page.comments != false -%}
<section class="comments" aria-labelledby="comments-title">
  <div class="container container--narrow">
    <h2 id="comments-title" class="section-title">Discussion</h2>
    <div class="giscus"></div>
    <script>
      (function () {
        var root = document.documentElement;
        var dark = root.getAttribute('data-theme') === 'dark' ||
          (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var cfg = {
          'data-repo': {{ site.giscus.repo | jsonify }},
          'data-repo-id': {{ site.giscus.repo_id | jsonify }},
          'data-category': {{ site.giscus.category | jsonify }},
          'data-category-id': {{ site.giscus.category_id | jsonify }},
          'data-mapping': {{ site.giscus.mapping | default: "pathname" | jsonify }},
          'data-strict': '0',
          'data-reactions-enabled': '1',
          'data-emit-metadata': '0',
          'data-input-position': 'top',
          'data-lang': 'en',
          'data-loading': 'lazy',
          'data-theme': dark ? 'transparent_dark' : 'light'
        };
        var s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        Object.keys(cfg).forEach(function (k) { s.setAttribute(k, cfg[k]); });
        document.currentScript.parentNode.appendChild(s);
      })();
    </script>
  </div>
</section>
{%- endif -%}
