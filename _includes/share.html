{%- assign sh_url = page.url | absolute_url -%}
{%- assign sh_url_enc = sh_url | cgi_escape -%}
{%- assign sh_title_enc = page.title | cgi_escape | replace: "+", "%20" -%}
<div class="share">
  <span class="share-label">Share</span>
  <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ sh_url_enc }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn" title="Share on LinkedIn">{% include icon.html name="linkedin" %}</a>
  <a class="share-btn" href="https://twitter.com/intent/tweet?url={{ sh_url_enc }}&amp;text={{ sh_title_enc }}" target="_blank" rel="noopener" aria-label="Share on X" title="Share on X">{% include icon.html name="x" %}</a>
  <a class="share-btn" href="mailto:?subject={{ sh_title_enc }}&amp;body={{ sh_url_enc }}" aria-label="Share by email" title="Share by email">{% include icon.html name="mail" %}</a>
  <button class="share-btn" type="button" data-copy-link="{{ sh_url }}" aria-label="Copy link" title="Copy link">{% include icon.html name="link" %}</button>
</div>
