{%- comment -%} Usage: {% include logo-mark.html id="header" %} — `id` keeps the gradient id unique per page. {%- endcomment -%}
{%- assign lm_id = "lm-grad-" | append: include.id -%}
<svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="{{ lm_id }}" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34B27F"/>
      <stop offset="1" stop-color="#2E8FD6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#{{ lm_id }})"/>
  <path d="M9 10.5h6.5L22.5 16M9 21.5h6.5L22.5 16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8.5" cy="10.5" r="2.5" fill="#fff"/>
  <circle cx="8.5" cy="21.5" r="2.5" fill="#fff"/>
  <circle cx="23" cy="16" r="3" fill="#fff"/>
</svg>
